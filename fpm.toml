name = "fortgen"
version = "0.2.0"
description = "Shared target-neutral kernel IR and Fortran/CUDA/Python code generation for lazy-fortran"
author = "krystophny"
license = "MIT"

[build]
auto-examples = false
auto-executables = false
# CMake runs fixture generators with their required output-path arguments.
auto-tests = false

[[executable]]
name = "fortgen-codegen"
source-dir = "app"
main = "fortgen_codegen.f90"

[[test]]
name = "test_fortgen"
source-dir = "test"
main = "test_fortgen.f90"

[[test]]
name = "test_kernel_ir"
source-dir = "test"
main = "test_kernel_ir.f90"

[[test]]
name = "test_reciprocal_kernel"
source-dir = "test"
main = "test_reciprocal_kernel.f90"

[[test]]
name = "test_linewrap_kernel"
source-dir = "test"
main = "test_linewrap_kernel.f90"

[[test]]
name = "test_temporary_names"
source-dir = "test"
main = "test_temporary_names.f90"

[[test]]
name = "test_python_emitter"
source-dir = "test"
main = "test_python_emitter.f90"

[[test]]
name = "test_precision_storage"
source-dir = "test"
main = "test_precision_storage.f90"

[[test]]
name = "test_precision_kernel"
source-dir = "test"
main = "test_precision_kernel.f90"

[[test]]
name = "test_expr_ir"
source-dir = "test"
main = "test_expr_ir.f90"

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"
