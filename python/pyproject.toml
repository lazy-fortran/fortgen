[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortgen"
version = "0.2.0"
description = "SymPy and Python frontends for the FortGen shared kernel IR"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
sympy = ["sympy>=1.14"]
test = ["pytest>=8", "sympy>=1.14"]

[tool.setuptools]
packages = ["fortgen"]
