name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: fortran-lang/setup-fpm@v7
      - name: Build and test Fortran with fpm
        run: |
          fpm build
          fpm test
          fpm install --prefix "$PWD/.local"
      - name: Build and test Fortran with CMake
        run: |
          cmake -S . -B cmake-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build cmake-build -j
          ctest --test-dir cmake-build --output-on-failure
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test direct SymPy frontend through installed FortGen backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'python[sympy,test]'
          export PATH="$PWD/.local/bin:$PATH"
          pytest -q python/test
