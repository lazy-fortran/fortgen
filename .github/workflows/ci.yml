name: ci

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh ci-build-test
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: ci-build-test
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: fortran-lang/setup-fpm@v7
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build and test Fortran with fpm
        run: |
          fpm build
          fpm test
          fpm install --prefix "$PWD/.local"
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build and test Fortran with CMake
        run: |
          cmake -S . -B cmake-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build cmake-build -j
          ctest --test-dir cmake-build --output-on-failure
        if: ${{ github.event.pull_request.head.repo.fork }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Test direct SymPy frontend through installed FortGen backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'python[sympy,test]'
          export PATH="$PWD/.local/bin:$PATH"
          pytest -q python/test
        if: ${{ github.event.pull_request.head.repo.fork }}
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
